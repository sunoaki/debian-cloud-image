name: Build Cloud Images

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        # 新增发行版只需在 include 里加一行，例如 Ubuntu:
        # - distro: ubuntu
        #   codename: noble
        #   major: "24.04"
        #   base_url: https://cloud-images.ubuntu.com/noble/current
        #   image_name: noble-server-cloudimg-amd64.img
        #   sha_file: SHA256SUMS
        #   hash_cmd: sha256sum
        #   sources_file: /etc/apt/sources.list.d/ubuntu.sources
        #   cloud_cfg: /etc/cloud/cloud.cfg.d/99-fake_cloud.cfg
        include:
          - distro: debian
            codename: trixie
            major: "13"
            base_url: https://cloud.debian.org/images/cloud/trixie/latest
            image_name: debian-13-genericcloud-amd64.qcow2
            sha_file: SHA512SUMS
            hash_cmd: sha512sum
            sources_file: /etc/apt/sources.list.d/debian.sources
            cloud_cfg: /etc/cloud/cloud.cfg.d/01_debian_cloud.cfg
          - distro: debian
            codename: bookworm
            major: "12"
            base_url: https://cloud.debian.org/images/cloud/bookworm/latest
            image_name: debian-12-genericcloud-amd64.qcow2
            sha_file: SHA512SUMS
            hash_cmd: sha512sum
            sources_file: /etc/apt/sources.list.d/debian.sources
            cloud_cfg: /etc/cloud/cloud.cfg.d/01_debian_cloud.cfg
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-utils parted wget

      - name: Download Cloud Image with checksum
        run: |
          IMAGE_URL="${{ matrix.base_url }}/${{ matrix.image_name }}"
          IMAGE_NAME="${{ matrix.image_name }}"
          IMAGE_SHA="$(wget -qO- ${{ matrix.base_url }}/${{ matrix.sha_file }} | grep "$IMAGE_NAME" | awk '{print $1}')"
          BUILD_DATE=$(date +%Y%m%d)
          RELEASE_NAME="${{ matrix.distro }}-${{ matrix.major }}-pve-sunoaki+${BUILD_DATE}.qcow2"

          echo "Downloading image..."
          wget "$IMAGE_URL" -O "$IMAGE_NAME"
          DL_SHA=$(${{ matrix.hash_cmd }} "$IMAGE_NAME" | awk '{print $1}')
          if [ "$DL_SHA" != "$IMAGE_SHA" ]; then
            echo "Downloaded image checksum mismatch!" >&2
            exit 1
          fi
          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV
          echo "RELEASE_NAME=$RELEASE_NAME" >> $GITHUB_ENV

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: .apt-cache
          key: apt-pkgs-${{ matrix.distro }}-${{ matrix.major }}-${{ github.run_id }}
          restore-keys: |
            apt-pkgs-${{ matrix.distro }}-${{ matrix.major }}-

      - name: Customize Image (chroot)
        run: |
          set -euo pipefail

          # Attach the image as a block device. qemu-nbd reads qcow2 directly;
          # fall back to losetup + raw conversion if the nbd module is missing.
          sudo modprobe nbd max_part=8 2>/dev/null || true
          ATTACHED_NBD=false
          if sudo qemu-nbd -c /dev/nbd0 "$IMAGE_NAME"; then
            ATTACHED_NBD=true
            DISKDEV=/dev/nbd0
            ROOTDEV=/dev/nbd0p1
          else
            echo "qemu-nbd unavailable, falling back to losetup..."
            sudo qemu-img convert -O raw "$IMAGE_NAME" /tmp/disk.raw
            LOOPDEV=$(sudo losetup --find --show --partscan /tmp/disk.raw)
            DISKDEV=$LOOPDEV
            ROOTDEV=${LOOPDEV}p1
          fi
          sudo partprobe "$DISKDEV" || true
          echo "Root partition: $ROOTDEV"

          sudo mkdir -p /mnt/img
          sudo mount "$ROOTDEV" /mnt/img

          # Bind host runtime dirs so apt/dpkg/update-grub work inside the chroot.
          sudo mount --bind /dev /mnt/img/dev
          sudo mount --bind /dev/pts /mnt/img/dev/pts
          sudo mount --bind /proc /mnt/img/proc
          sudo mount --bind /sys /mnt/img/sys

          # DNS inside the chroot; restore the original file afterwards.
          sudo cp -a /mnt/img/etc/resolv.conf /tmp/resolv.conf.orig
          sudo rm -f /mnt/img/etc/resolv.conf
          echo "nameserver 1.1.1.1" | sudo tee /mnt/img/etc/resolv.conf > /dev/null

          # Seed apt's download cache from a previous run (if any).
          if [ -d .apt-cache ] && ls .apt-cache/*.deb >/dev/null 2>&1; then
            sudo cp -n .apt-cache/*.deb /mnt/img/var/cache/apt/archives/ || true
          fi

          # Per-distro customization paths (see strategy matrix).
          export SOURCES_FILE="${{ matrix.sources_file }}"
          export CLOUD_CFG="${{ matrix.cloud_cfg }}"

          sudo --preserve-env=SOURCES_FILE,CLOUD_CFG chroot /mnt/img /bin/bash -euxo pipefail <<'CHROOT_EOF'
          export DEBIAN_FRONTEND=noninteractive
          PACKAGES="qemu-guest-agent spice-vdagent aria2 net-tools iputils-ping iputils-arping iputils-tracepath mtr-tiny dnsutils sudo bash-completion unzip wget curl nano most screen less vim bzip2 lldpd htop zstd tmux"
          # apt sources (DEB822): drop deb-src lines
          sed -i 's|Types: deb deb-src|Types: deb|g' "$SOURCES_FILE"
          # cloud-init: do not regenerate apt sources at boot
          sed -i 's|generate_mirrorlists: true|generate_mirrorlists: false|g' "$CLOUD_CFG"
          apt-get update
          apt-get -y upgrade
          apt-get -y install $PACKAGES
          apt-get -y autoremove --purge
          # Timezone
          ln -sf /usr/share/zoneinfo/Asia/Hong_Kong /etc/localtime
          echo "Asia/Hong_Kong" > /etc/timezone
          # GRUB: disable os-prober (loopback detection breaks booting)
          if grep -q '^GRUB_DISABLE_OS_PROBER' /etc/default/grub; then
            sed -i 's|^#\?GRUB_DISABLE_OS_PROBER=.*|GRUB_DISABLE_OS_PROBER=true|' /etc/default/grub
          else
            printf '# disables OS prober to avoid loopback detection which breaks booting\nGRUB_DISABLE_OS_PROBER=true\n' >> /etc/default/grub
          fi
          update-grub
          # Serial console on ttyS1 (default PVE serial terminal)
          ln -sf /lib/systemd/system/serial-getty@.service /etc/systemd/system/getty.target.wants/serial-getty@ttyS1.service
          # NTP
          printf '\nNTP=time.apple.com time.windows.com\n' >> /etc/systemd/timesyncd.conf
          # Root login by password (PVE cloud-init defaults: root user + ssh password)
          sed -i 's|disable_root: true|disable_root: false|g' /etc/cloud/cloud.cfg
          grep -q '^disable_root:' /etc/cloud/cloud.cfg || echo 'disable_root: false' >> /etc/cloud/cloud.cfg
          sed -i 's|ssh_pwauth: false|ssh_pwauth: true|g' /etc/cloud/cloud.cfg
          grep -q '^ssh_pwauth:' /etc/cloud/cloud.cfg || echo 'ssh_pwauth: true' >> /etc/cloud/cloud.cfg
          printf 'PermitRootLogin yes\n' > /etc/ssh/sshd_config.d/99-pve-root-login.conf
          # Root prompt (PVE default login is root)
          touch /root/.bashrc
          echo 'PS1="\[\033[01;31m\]\u\[\033[01;33m\]@\[\033[01;36m\]\h \[\033[01;33m\]\w \[\033[01;35m\]\$ \[\033[00m\]"' >> /root/.bashrc
          if [ ! -f /root/.profile ]; then
            echo 'if [ -n "$BASH_VERSION" ]; then . ~/.bashrc; fi' > /root/.profile
          elif ! grep -q 'bashrc' /root/.profile; then
            echo 'if [ -n "$BASH_VERSION" ]; then . ~/.bashrc; fi' >> /root/.profile
          fi
          # BBR + TCP tuning
          printf 'tcp_bbr\n' > /etc/modules-load.d/bbr.conf
          printf 'net.core.default_qdisc = fq\nnet.ipv4.tcp_congestion_control = bbr\nnet.ipv4.tcp_slow_start_after_idle = 0\nnet.ipv4.tcp_fastopen = 3\n' > /etc/sysctl.d/99-network-tuning.conf
          # Cleanup
          rm -f /var/log/*.log
          rm -rf /tmp/*
          truncate -s 0 /etc/machine-id
          CHROOT_EOF

          # Export downloaded .debs for the cache, then scrub apt state from the image.
          mkdir -p .apt-cache
          sudo cp -n /mnt/img/var/cache/apt/archives/*.deb .apt-cache/ || true
          sudo rm -rf /mnt/img/var/lib/apt/lists /mnt/img/var/cache/apt/archives /mnt/img/var/cache/apt/partial

          # Restore resolv.conf and unmount in reverse order.
          sudo cp -a /tmp/resolv.conf.orig /mnt/img/etc/resolv.conf
          sudo umount /mnt/img/sys
          sudo umount /mnt/img/proc
          sudo umount /mnt/img/dev/pts
          sudo umount /mnt/img/dev
          sudo umount /mnt/img
          if [ "$ATTACHED_NBD" = "true" ]; then
            sudo qemu-nbd -d /dev/nbd0
          else
            sudo losetup -d "$LOOPDEV"
            rm -f /tmp/disk.raw
          fi

      - name: Compress image
        run: |
          sudo qemu-img convert -O qcow2 -c "$IMAGE_NAME" "$RELEASE_NAME"
          rm -f "$IMAGE_NAME"
          echo "IMAGE_NAME=$RELEASE_NAME" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.distro }}-${{ matrix.major }}
          path: ${{ env.IMAGE_NAME }}
          if-no-files-found: error

  release:
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Download built images
        uses: actions/download-artifact@v4
        with:
          path: ./images
          merge-multiple: true

      - name: Delete stale release for today
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG=$(date +%Y%m%d)
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Deleting previous release $TAG"
            gh release delete "$TAG" --yes --cleanup-tag
          else
            # Remove a bare leftover tag (an earlier build may have been interrupted).
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}" >/dev/null 2>&1 || true
          fi
          echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV

      - name: Upload Images to Release
        uses: softprops/action-gh-release@v3
        with:
          files: ./images/*.qcow2
          name: "PVE Cloud Images ${{ env.RELEASE_TAG }}"
          tag_name: ${{ env.RELEASE_TAG }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
