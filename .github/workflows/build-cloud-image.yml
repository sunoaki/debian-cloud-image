name: Build Cloud Images

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 可选；格式 YYYYMMDD。留空则使用当前 UTC 日期
        required: false
        type: string
  schedule:
    # 每周日 UTC 02:17（北京时间周日 10:17）构建一次最新版本。
    # 避开整点/半点，release 按日期 tag，同日重建会先删旧再发布。
    - cron: "17 2 * * 0"

# Only the release job needs write access; keep it scoped there.
permissions:
  contents: read

# Same-day manual rebuilds queue behind each other instead of racing to
# delete/re-create the same release tag.
concurrency:
  group: cloud-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Read config/images.yaml (single source of truth for the distro matrix).
  generate-matrix:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      names: ${{ steps.matrix.outputs.names }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Emit matrix JSON
        id: matrix
        run: |
          set -euo pipefail
          # Emit the matrix and, separately, the "<distro>-<major>" artifact
          # names so the release job verifies the actual configured set instead
          # of a hand-maintained list that silently breaks when a distro is
          # added (the whole point of the yaml-driven matrix).
          ruby -ryaml -rjson -e '
            images = YAML.load_file("config/images.yaml")["images"]
            # frozen entries only build on a manual dispatch: their upstream
            # content can no longer change, so a scheduled rebuild would produce
            # the same image and a redundant release tag.
            if ENV["GITHUB_EVENT_NAME"] != "workflow_dispatch"
              frozen = images.count { |i| i["frozen"] }
              images = images.reject { |i| i["frozen"] }
              warn "skipping #{frozen} frozen entr(ies) on a scheduled run" if frozen > 0
            end
            File.open(ENV["GITHUB_OUTPUT"], "a") do |f|
              f.puts "matrix=#{JSON.generate(images)}"
              f.puts "names=#{JSON.generate(images.map { |i| "#{i["distro"]}-#{i["major"]}" })}"
            end
          '

  # Compute the release tag once so build and release agree even across a UTC
  # midnight rollover, and allow a manual override for re-runs.
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
    steps:
      - name: Resolve release tag
        id: meta
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$(date -u +%Y%m%d)}"
          [[ "$tag" =~ ^[0-9]{8}$ ]] || {
            echo "release_tag must be YYYYMMDD, got: $tag" >&2
            exit 1
          }
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: [generate-matrix, prepare]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false # 单个发行版失败不拖累其他构建
      matrix:
        include: ${{ fromJSON(needs.generate-matrix.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: |
          sudo apt-get update
          # xfsprogs provides xfs_growfs, which the XFS roots (Rocky, CentOS)
          # need; e2fsprogs (resize2fs) is already present on the runner image.
          sudo apt-get install -y qemu-utils cloud-guest-utils wget xfsprogs

      # Split in two so the ~600 MB image can be cached on its *checksum*: the
      # checksum has to be fetched before a stable cache key exists, and a hit
      # then skips the download entirely. Previously only the apt .debs were
      # cached and every run re-fetched ~3 GB across the matrix.
      - name: Fetch expected checksum
        id: sums
        env:
          BASE_URL: ${{ matrix.base_url }}
          SHA_FILE: ${{ matrix.sha_file }}
        run: |
          set -euo pipefail
          IMAGE_NAME="${{ matrix.image_name }}"
          # shellcheck source=scripts/partition-layout.sh
          . scripts/partition-layout.sh
          fetch_retry() {
            local url="$1" out="$2" attempt=1
            until wget --tries=3 --retry-connrefused --waitretry=2 -O "$out" "$url" 2>&1; do
              if [ "$attempt" -ge 5 ]; then
                echo "Download failed after $attempt attempts: $url" >&2
                return 1
              fi
              echo "Attempt $attempt failed, retrying in 5s: $url" >&2
              sleep 5
              attempt=$((attempt + 1))
            done
          }
          fetch_retry "${BASE_URL}/${SHA_FILE}" sums.txt
          # layout_checksum_for handles the GNU, GNU-binary-marker and BSD
          # checksum shapes across distros; the previous awk matched only GNU.
          image_sha="$(layout_checksum_for "$(cat sums.txt)" "$IMAGE_NAME")"
          [ -n "$image_sha" ] || {
            echo "Checksum entry not found for ${IMAGE_NAME} in ${SHA_FILE}" >&2
            exit 1
          }
          echo "sha=$image_sha" >> "$GITHUB_OUTPUT"
          echo "SRC_IMAGE=$IMAGE_NAME" >> "$GITHUB_ENV"
          echo "RELEASE_NAME=${{ matrix.distro }}-${{ matrix.major }}-pve-sunoaki+${{ needs.prepare.outputs.release_tag }}.qcow2" >> "$GITHUB_ENV"

      - name: Restore cloud image cache
        id: image-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ matrix.image_name }}
          # Keyed on the upstream checksum, so an unchanged image is a hit and a
          # rebuilt upstream image gets a fresh download. The checksum is the
          # prefix so an ancient cache entry is still preferred over nothing.
          key: cloud-image-${{ matrix.distro }}-${{ matrix.major }}-${{ steps.sums.outputs.sha }}
          restore-keys: cloud-image-${{ matrix.distro }}-${{ matrix.major }}-

      - name: Download Cloud Image with checksum
        env:
          BASE_URL: ${{ matrix.base_url }}
          HASH_CMD: ${{ matrix.hash_cmd }}
          EXPECTED_SHA: ${{ steps.sums.outputs.sha }}
          CACHE_HIT: ${{ steps.image-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          IMAGE_NAME="${{ matrix.image_name }}"

          # Download with retries: cloud.debian.org is GeoDNS-fronted and
          # picks different mirrors per runner egress IP; freshly published
          # releases can have lagging mirrors. Avoid -qO- through a pipe so a
          # failing wget never SIGPIPEs or swallows its error output.
          fetch_retry() {
            local url="$1" out="$2" attempt=1
            until wget --tries=3 --retry-connrefused --waitretry=2 -O "$out" "$url" 2>&1; do
              if [ "$attempt" -ge 5 ]; then
                echo "Download failed after $attempt attempts: $url" >&2
                return 1
              fi
              echo "Attempt $attempt failed, retrying in 5s: $url" >&2
              sleep 5
              attempt=$((attempt + 1))
            done
          }

          if [ "$CACHE_HIT" = "true" ]; then
            echo "Using cached ${IMAGE_NAME}"
          else
            echo "Downloading image..."
            fetch_retry "${BASE_URL}/${IMAGE_NAME}" "$IMAGE_NAME"
          fi
          # Verify the checksum on every run, cached or not: a cache entry could
          # be truncated, and this is the one place the bytes are checked.
          dl_sha="$(${HASH_CMD} "$IMAGE_NAME" | awk '{print $1}')"
          [ "$dl_sha" = "$EXPECTED_SHA" ] || {
            echo "Image checksum mismatch for ${IMAGE_NAME}: expected ${EXPECTED_SHA}, got ${dl_sha}" >&2
            [ "$CACHE_HIT" = "true" ] && rm -f "$IMAGE_NAME"
            exit 1
          }

      # apt .deb cache keyed on the package list; a fixed key is shared across
      # dates (no run_id) so rebuilds and same-day reruns actually hit it.
      - name: Restore apt archive cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .apt-cache
          key: apt-debs-${{ matrix.distro }}-${{ matrix.major }}-${{ hashFiles('config/cloud-image-packages.txt') }}

      # Host-side plumbing + chroot customization; see scripts/customize-image.sh.
      # SRC_IMAGE is the freshly downloaded file; the script never writes it in
      # place, so the name stays distinct from the RELEASE_NAME it produces.
      - name: Customize Image (chroot)
        env:
          SRC_IMAGE: ${{ env.SRC_IMAGE }}
          SOURCES_FILE: ${{ matrix.sources_file }}
          CLOUD_CFG: ${{ matrix.cloud_cfg }}
          SOURCES_FORMAT: ${{ matrix.sources_format }}
          FAMILY: ${{ matrix.family }}
          PACKAGES_FILE: ${{ matrix.packages_file }}
          SYSCTL_FILE: ${{ matrix.sysctl_file }}
        run: sudo -E bash scripts/customize-image.sh

      - name: Compress image
        run: |
          sudo qemu-img convert -O qcow2 -c "$SRC_IMAGE" "$RELEASE_NAME"
          rm -f "$SRC_IMAGE"
          # qemu-img ran as root, so the output is root-owned. The boot test runs
          # as the unprivileged runner user and could never open it: it failed
          # with "Could not open ...: Permission denied" and reported only "did not
          # reach a login prompt", which is why the boot test never passed on any
          # distro. Hand ownership back to the build user.
          sudo chown "$(id -u):$(id -g)" "$RELEASE_NAME"
          echo "IMAGE_NAME=$RELEASE_NAME" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.distro }}-${{ matrix.major }}
          path: ${{ env.IMAGE_NAME }}
          if-no-files-found: error
          # release is the long-lived artifact; keep the intermediate short
          retention-days: 3

      # Soft verification tier: boot the compressed image and wait for the serial
      # console to reach a login prompt. KVM is not guaranteed on hosted runners
      # (GitHub documents nested VMs as unsupported), so this falls back to TCG
      # and, because TCG is ~10-50x slower, it is advisory: a failure here is
      # reported but does not fail the build. The hard content assertions live in
      # scripts/customize-image.sh.
      #
      # On by default for the rhel family, off for debian. The RHEL family is
      # where a wrong result is hardest to catch by reading files: SELinux labels,
      # grub2 and the separate XBOOTLDR /boot can all fail at boot while every
      # file-based assertion passes. Debian/Ubuntu have shipped through this path
      # for longer, and their builds are the common case for the schedule, so they
      # stay opt-in to avoid adding minutes to every run. BOOT_TEST=true forces it
      # on everywhere; BOOT_TEST=false forces it off.
      - name: Boot test (advisory, TCG)
        if: ${{ (matrix.family == 'rhel' && vars.BOOT_TEST != 'false') || vars.BOOT_TEST == 'true' }}
        continue-on-error: true
        env:
          IMAGE: ${{ env.IMAGE_NAME }}
        run: |
          set -euo pipefail
          sudo apt-get install -y qemu-system-x86 ovmf
          accel=tcg
          [ -r /dev/kvm ] && accel=kvm
          # -cpu max: the RHEL family's glibc is built for x86-64-v2 and aborts
          # with "Fatal glibc error: CPU does not ..." under qemu's default CPU
          # model, which panics init and looks like an unbootable image. Measured
          # on a stock Rocky 9 image: default model -> kernel panic, -cpu max ->
          # login prompt.

          # Firmware is chosen from the partition type GUIDs that
          # scripts/customize-image.sh read while the disk was attached, because
          # a qcow2 cannot be probed directly -- sfdisk reads the container and
          # reports no partition table. Booting with the wrong firmware fails for
          # reasons unrelated to the image being broken.
          if [ "${FIRMWARE:-bios}" = "efi" ]; then
            firmware=uefi
            # OVMF's variable store must be writable (the firmware persists NVRAM
            # there) and the packaged file is root-only, which made qemu fail with
            # "Could not open .../OVMF_VARS_4M.fd: Permission denied". Copy it to a
            # path this user owns.
            cp /usr/share/OVMF/OVMF_VARS_4M.fd "$PWD/ovmf-vars.fd"
            # split across lines; shellcheck SC2054 objects to the comma inside
            # the array element `if=pflash,format=raw,...`
            fw_args=(-drive "if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.fd"
                     -drive "if=pflash,format=raw,file=$PWD/ovmf-vars.fd")
          else
            firmware=bios
            fw_args=()
          fi
          echo "Using $firmware firmware with -accel $accel (TCG is far slower than KVM)"

          started=$SECONDS
          # Serial goes to a file because the images install serial-getty@ttyS1.
          # qemu keeps running after boot, so poll the log and stop it the moment
          # the prompt appears instead of waiting for the process to exit. 600s is
          # a hang guard with ~4x headroom over the measured baseline: a noble
          # image reached the login prompt in 150s wall clock on a 2-vCPU TCG run
          # (the guest clock reported 15.6s), and runner speed varies.
          rm -f console.log qemu.log
          # Keep qemu's own stderr: it goes nowhere useful otherwise. A previous
          # version redirected it to /dev/null, so when the requested accelerator
          # was unusable the only symptom was "did not reach a login prompt in 2s"
          # with no console.log -- which says nothing about the actual cause.
          qemu-system-x86_64 \
            -machine q35,accel="$accel" -cpu max -m 2048 -smp 2 -nographic \
            "${fw_args[@]}" \
            -drive file="$IMAGE",if=virtio,format=qcow2 \
            -serial "file:console.log" >qemu.log 2>&1 &
          qpid=$!
          reached=""
          while [ $((SECONDS - started)) -lt 600 ]; do
            # Match the getty prompt, not "Reached target": systemd reaches many
            # targets long before the system is up, and it colours its output, so
            # a multi-word target name never matches contiguously anyway. The
            # prompt it prints is "<host> login: ".
            if grep -aqE 'login: ' console.log 2>/dev/null; then
              reached=yes
              break
            fi
            kill -0 "$qpid" 2>/dev/null || break
            sleep 2
          done
          elapsed=$((SECONDS - started))
          kill -9 "$qpid" 2>/dev/null || true
          wait "$qpid" 2>/dev/null || true

          if [ -z "$reached" ] && ! [ -s console.log ]; then
            # qemu never even started. Report why instead of blaming the image.
            echo "qemu produced no guest console output, so it failed to start."
            echo "--- qemu output ---"
            tail -n 30 qemu.log || true
            echo "::warning title=Boot test::qemu failed to start on $accel after ${elapsed}s (see qemu output above)"
            # A dead qemu says nothing about the image. Retry once in software
            # emulation so a missing/unusable KVM only costs time, not signal.
            if [ "$accel" = "kvm" ]; then
              echo "Retrying with -accel tcg"
              rm -f console.log
              qemu-system-x86_64 \
                -machine q35,accel=tcg -cpu max -m 2048 -smp 2 -nographic \
                "${fw_args[@]}" \
                -drive file="$IMAGE",if=virtio,format=qcow2 \
                -serial "file:console.log" >qemu.log 2>&1 &
              qpid=$!
              reached=""
              while [ $((SECONDS - started)) -lt 600 ]; do
                if grep -aqE 'login: ' console.log 2>/dev/null; then
                  reached=yes
                  break
                fi
                kill -0 "$qpid" 2>/dev/null || break
                sleep 2
              done
              elapsed=$((SECONDS - started))
              kill -9 "$qpid" 2>/dev/null || true
              wait "$qpid" 2>/dev/null || true
              accel=tcg
            fi
          fi

          echo "--- last console output (${elapsed}s, ${firmware}/${accel}) ---"
          tail -n 40 console.log 2>/dev/null || echo "(console.log is empty)"
          [ -n "$reached" ] || {
            echo "::warning title=Boot test::console did not reach a login prompt within ${elapsed}s ($firmware/$accel)"
            exit 1
          }
          echo "Console reached a login prompt after ${elapsed}s ($firmware/$accel)"

      - name: Summarize build
        run: |
          printf '%s\n' \
            "distro=${{ matrix.distro }} ${{ matrix.major }}" \
            "image=$(basename "$IMAGE_NAME")"

  release:
    needs: [prepare, build, generate-matrix]
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download built images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ./images
          merge-multiple: true

      # The expected set comes from config/images.yaml, so adding a distro needs
      # no edit here. A hardcoded list silently rejected any new entry.
      - name: Verify release contents
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          NAMES: ${{ needs.generate-matrix.outputs.names }}
        run: |
          set -euo pipefail
          mapfile -t expected < <(
            printf '%s' "$NAMES" |
              ruby -rjson -e "JSON.parse(\$stdin.read).each { |n| puts \"#{n}-pve-sunoaki+#{ENV['RELEASE_TAG']}.qcow2\" }"
          )
          for image in "${expected[@]}"; do
            test -s "images/$image" || {
              echo "Missing or empty image: $image" >&2
              exit 1
            }
          done
          actual="$(find images -maxdepth 1 -type f -name '*.qcow2' | wc -l)"
          test "$actual" -eq "${#expected[@]}" || {
            echo "Expected ${#expected[@]} qcow2 artifacts, found $actual" >&2
            exit 1
          }

      - name: Replace release for this date
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail
          # The release job has no checkout, so gh cannot infer the repo from
          # git; always pass -R explicitly (observed failure 2026-08-01:
          # "failed to run git: not a git repository").
          if gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Deleting previous release $RELEASE_TAG"
            gh release delete "$RELEASE_TAG" --yes --cleanup-tag -R "$GITHUB_REPOSITORY"
          else
            # Remove a bare leftover tag (an earlier build may have been interrupted).
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${RELEASE_TAG}" >/dev/null 2>&1 || true
          fi
          # Also purge orphan drafts (no tag) left behind by an interrupted run.
          gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
            --jq '.[] | select(.draft == true and .tag_name == "") | .id' |
            while read -r draft_id; do
              echo "Deleting orphan draft release $draft_id"
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/${draft_id}" >/dev/null
            done
          # gh release create publishes immediately; softprops/action-gh-release
          # can leave the release stuck as an untagged draft (observed 2026-08-01).
          # The image list in the notes is built from the artifacts actually
          # released, so it cannot drift from config/images.yaml either.
          notes="Proxmox VE cloud images for $RELEASE_TAG"$'\n\n'
          for f in ./images/*.qcow2; do
            notes+="- $(basename "$f")"$'\n'
          done
          gh release create "$RELEASE_TAG" ./images/*.qcow2 \
            -R "$GITHUB_REPOSITORY" \
            --title "PVE Cloud Images $RELEASE_TAG" \
            --notes "$notes"

  notify:
    needs: [prepare, build, release]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Summarize results
        run: |
          printf '%s\n' \
            "release_tag=${{ needs.prepare.outputs.release_tag }}" \
            "build=${{ needs.build.result }}" \
            "release=${{ needs.release.result }}"
          # Future: hook Slack/Discord/issue notification here, one alert per
          # run (not per matrix item) to avoid alert storms on platform failure.
