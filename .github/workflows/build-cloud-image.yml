name: Build Cloud Images

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 可选；格式 YYYYMMDD。留空则使用当前 UTC 日期
        required: false
        type: string
  schedule:
    # 每周日 UTC 02:17（北京时间周日 10:17）构建一次最新版本。
    # 避开整点/半点，release 按日期 tag，同日重建会先删旧再发布。
    - cron: "17 2 * * 0"

# Only the release job needs write access; keep it scoped there.
permissions:
  contents: read

# Same-day manual rebuilds queue behind each other instead of racing to
# delete/re-create the same release tag.
concurrency:
  group: cloud-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Read config/images.yaml (single source of truth for the distro matrix).
  generate-matrix:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Emit matrix JSON
        id: matrix
        run: |
          echo "matrix=$(ruby -ryaml -rjson -e 'puts JSON.generate(YAML.load_file("config/images.yaml")["images"])')" >> "$GITHUB_OUTPUT"

  # Compute the release tag once so build and release agree even across a UTC
  # midnight rollover, and allow a manual override for re-runs.
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
    steps:
      - name: Resolve release tag
        id: meta
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$(date -u +%Y%m%d)}"
          [[ "$tag" =~ ^[0-9]{8}$ ]] || {
            echo "release_tag must be YYYYMMDD, got: $tag" >&2
            exit 1
          }
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: [generate-matrix, prepare]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false # 单个发行版失败不拖累其他构建
      matrix:
        include: ${{ fromJSON(needs.generate-matrix.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-utils parted cloud-guest-utils wget

      - name: Download Cloud Image with checksum
        env:
          BASE_URL: ${{ matrix.base_url }}
          SHA_FILE: ${{ matrix.sha_file }}
          HASH_CMD: ${{ matrix.hash_cmd }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail
          IMAGE_NAME="${{ matrix.image_name }}"
          RELEASE_NAME="${{ matrix.distro }}-${{ matrix.major }}-pve-sunoaki+${RELEASE_TAG}.qcow2"

          # Exact checksum lookup ($2 == file or "$2 == *file"), fail loudly
          # instead of grepping with regex/substring surprises.
          image_sha="$(wget -qO- "${BASE_URL}/${SHA_FILE}" | awk -v f="$IMAGE_NAME" '$2 == f || $2 == "*" f { print $1; exit }')"
          [ -n "$image_sha" ] || {
            echo "Checksum entry not found for ${IMAGE_NAME}" >&2
            exit 1
          }

          echo "Downloading image..."
          wget "${BASE_URL}/${IMAGE_NAME}" -O "$IMAGE_NAME"
          dl_sha="$(${HASH_CMD} "$IMAGE_NAME" | awk '{print $1}')"
          [ "$dl_sha" = "$image_sha" ] || {
            echo "Downloaded image checksum mismatch!" >&2
            exit 1
          }
          echo "IMAGE_NAME=$IMAGE_NAME" >> "$GITHUB_ENV"
          echo "RELEASE_NAME=$RELEASE_NAME" >> "$GITHUB_ENV"

      # apt .deb cache keyed on the package list; a fixed key is shared across
      # dates (no run_id) so rebuilds and same-day reruns actually hit it.
      - name: Restore apt archive cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .apt-cache
          key: apt-debs-${{ matrix.distro }}-${{ matrix.major }}-${{ hashFiles('config/cloud-image-packages.txt') }}

      # Host-side plumbing + chroot customization; see scripts/customize-image.sh.
      - name: Customize Image (chroot)
        env:
          IMAGE_NAME: ${{ matrix.image_name }}
          SOURCES_FILE: ${{ matrix.sources_file }}
          CLOUD_CFG: ${{ matrix.cloud_cfg }}
          SOURCES_FORMAT: ${{ matrix.sources_format }}
        run: sudo -E bash scripts/customize-image.sh

      - name: Compress image
        run: |
          sudo qemu-img convert -O qcow2 -c "$IMAGE_NAME" "$RELEASE_NAME"
          rm -f "$IMAGE_NAME"
          echo "IMAGE_NAME=$RELEASE_NAME" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.distro }}-${{ matrix.major }}
          path: ${{ env.IMAGE_NAME }}
          if-no-files-found: error
          # release is the long-lived artifact; keep the intermediate short
          retention-days: 3

  release:
    needs: [prepare, build]
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download built images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ./images
          merge-multiple: true

      - name: Verify release contents
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail
          expected=(
            "debian-12-pve-sunoaki+${RELEASE_TAG}.qcow2"
            "debian-13-pve-sunoaki+${RELEASE_TAG}.qcow2"
            "ubuntu-22.04-pve-sunoaki+${RELEASE_TAG}.qcow2"
            "ubuntu-24.04-pve-sunoaki+${RELEASE_TAG}.qcow2"
            "ubuntu-26.04-pve-sunoaki+${RELEASE_TAG}.qcow2"
          )
          for image in "${expected[@]}"; do
            test -s "images/$image" || {
              echo "Missing or empty image: $image" >&2
              exit 1
            }
          done
          actual="$(find images -maxdepth 1 -type f -name '*.qcow2' | wc -l)"
          test "$actual" -eq "${#expected[@]}" || {
            echo "Unexpected qcow2 artifact count: $actual" >&2
            exit 1
          }

      - name: Replace release for this date
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Deleting previous release $RELEASE_TAG"
            gh release delete "$RELEASE_TAG" --yes --cleanup-tag
          else
            # Remove a bare leftover tag (an earlier build may have been interrupted).
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${RELEASE_TAG}" >/dev/null 2>&1 || true
          fi
          # gh release create publishes immediately; softprops/action-gh-release
          # can leave the release stuck as an untagged draft (observed 2026-08-01).
          gh release create "$RELEASE_TAG" ./images/*.qcow2 \
            --title "PVE Cloud Images $RELEASE_TAG" \
            --notes "Proxmox VE cloud images for $RELEASE_TAG (debian-12/13, ubuntu-22.04/24.04/26.04)"

  notify:
    needs: [prepare, build, release]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Summarize results
        run: |
          printf '%s\n' \
            "release_tag=${{ needs.prepare.outputs.release_tag }}" \
            "build=${{ needs.build.result }}" \
            "release=${{ needs.release.result }}"
          # Future: hook Slack/Discord/issue notification here, one alert per
          # run (not per matrix item) to avoid alert storms on platform failure.
