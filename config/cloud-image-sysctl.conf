# PVE cloud-image kernel tuning (installed as /etc/sysctl.d/99-pve-cloud-tuning.conf)
# Reviewed against gpt-5.6-sol for direct-public-IP tenants (no NAT, possibly
# asymmetric return paths) on Ceph RBD-backed virtio-scsi disks. Values stay
# conservative so the template is safe for arbitrary tenant workloads.

# --- Network: public DIA links ---
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# accept/syn backlog for bursty inbound
net.core.somaxconn = 8192
net.ipv4.tcp_max_syn_backlog = 8192

# raise ephemeral ceiling 60999 -> 65535; keep low range untouched so tenants'
# custom listening ports (10000-32767) stay out of the pool
net.ipv4.ip_local_port_range = 32768 65535

# TCP autotuning ceilings for high-BDP DIA paths
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_rmem = 4096 131072 16777216
net.ipv4.tcp_wmem = 4096 16384 16777216

# loose rp_filter: tenants get multiple public IPs / paths with asymmetric
# return routing (DIA + 3C); strict mode silently drops
net.ipv4.conf.all.rp_filter = 2
net.ipv4.conf.default.rp_filter = 2
net.ipv4.tcp_syncookies = 1

# --- Storage: Ceph RBD (virtio-scsi) ---
# virtio-scsi queues can exhaust the 64k default aio pool at high IOPS
fs.aio-max-nr = 1048576

# smoother writeback: avoid dirty-page build-up spikes on RBD disks
vm.dirty_background_ratio = 5
vm.dirty_ratio = 10

# keep hot pages in RAM; databases hate swap churn
vm.swappiness = 10

# --- General tenant workloads (db / middleware) ---
vm.max_map_count = 1048576
fs.file-max = 2097152
fs.inotify.max_user_watches = 524288
