# Cloud image build matrix - one entry per distro release.
# Consumed by the `generate-matrix` job in build-cloud-image.yml.
# Add a new distro by appending an entry here (and a PVE template VMID in
# update-cloud-templates.sh on the PVE side).
#
# sources_format:
#   deb822 = /etc/apt/sources.list.d/*.sources (Debian 12+ / Ubuntu 24.04+)
#   legacy = /etc/apt/sources.list single-line deb format (Ubuntu 22.04)
#   rpm    = /etc/yum.repos.d/*.repo; the rhel family ignores this field and
#            always rewrites the .repo files itself
#
# family: selects scripts/family/<family>.sh, which supplies the hooks that
#   differ between distro families (package manager, source layout, bootloader
#   update, NTP daemon, ssh unit name, SELinux relabel, default user to rename).
# packages_file / sysctl_file: per-family inputs; they live next to the repo root.
# frozen: true builds only on a manual workflow_dispatch, never on the schedule.
#   For a release whose upstream content can no longer change, a weekly rebuild
#   would produce a byte-identical image and a redundant release tag.
images:
  - distro: debian
    codename: trixie
    major: "13"
    base_url: https://cloud.debian.org/images/cloud/trixie/latest
    image_name: debian-13-genericcloud-amd64.qcow2
    sha_file: SHA512SUMS
    hash_cmd: sha512sum
    sources_file: /etc/apt/sources.list.d/debian.sources
    cloud_cfg: /etc/cloud/cloud.cfg.d/01_debian_cloud.cfg
    sources_format: deb822
    family: debian
    packages_file: config/packages-deb.txt
    sysctl_file: config/sysctl-debian.conf

  - distro: debian
    codename: bookworm
    major: "12"
    base_url: https://cloud.debian.org/images/cloud/bookworm/latest
    image_name: debian-12-genericcloud-amd64.qcow2
    sha_file: SHA512SUMS
    hash_cmd: sha512sum
    sources_file: /etc/apt/sources.list.d/debian.sources
    cloud_cfg: /etc/cloud/cloud.cfg.d/01_debian_cloud.cfg
    sources_format: deb822
    family: debian
    packages_file: config/packages-deb.txt
    sysctl_file: config/sysctl-debian.conf

  - distro: ubuntu
    codename: resolute
    major: "26.04"
    base_url: https://cloud-images.ubuntu.com/resolute/current
    image_name: resolute-server-cloudimg-amd64.img
    sha_file: SHA256SUMS
    hash_cmd: sha256sum
    sources_file: /etc/apt/sources.list.d/ubuntu.sources
    cloud_cfg: /etc/cloud/cloud.cfg.d/99-fake_cloud.cfg
    sources_format: deb822
    family: debian
    packages_file: config/packages-deb.txt
    sysctl_file: config/sysctl-debian.conf

  - distro: ubuntu
    codename: noble
    major: "24.04"
    base_url: https://cloud-images.ubuntu.com/noble/current
    image_name: noble-server-cloudimg-amd64.img
    sha_file: SHA256SUMS
    hash_cmd: sha256sum
    sources_file: /etc/apt/sources.list.d/ubuntu.sources
    cloud_cfg: /etc/cloud/cloud.cfg.d/99-fake_cloud.cfg
    sources_format: deb822
    family: debian
    packages_file: config/packages-deb.txt
    sysctl_file: config/sysctl-debian.conf

  - distro: ubuntu
    codename: jammy
    major: "22.04"
    base_url: https://cloud-images.ubuntu.com/jammy/current
    image_name: jammy-server-cloudimg-amd64.img
    sha_file: SHA256SUMS
    hash_cmd: sha256sum
    sources_file: /etc/apt/sources.list
    cloud_cfg: /etc/cloud/cloud.cfg.d/99-fake_cloud.cfg
    sources_format: legacy
    family: debian
    packages_file: config/packages-deb.txt
    sysctl_file: config/sysctl-debian.conf

  - distro: rocky
    codename: blue-onyx
    major: "9"
    base_url: https://dl.rockylinux.org/pub/rocky/9/images/x86_64
    image_name: Rocky-9-GenericCloud-Base.latest.x86_64.qcow2
    sha_file: Rocky-9-GenericCloud-Base.latest.x86_64.qcow2.CHECKSUM
    hash_cmd: sha256sum
    sources_file: /etc/yum.repos.d/rocky.repo
    cloud_cfg: /etc/cloud/cloud.cfg
    sources_format: rpm
    family: rhel
    packages_file: config/packages-rpm.txt
    sysctl_file: config/sysctl-rhel.conf

  - distro: rocky
    codename: red-quartz
    major: "10"
    base_url: https://dl.rockylinux.org/pub/rocky/10/images/x86_64
    image_name: Rocky-10-GenericCloud-Base.latest.x86_64.qcow2
    sha_file: Rocky-10-GenericCloud-Base.latest.x86_64.qcow2.CHECKSUM
    hash_cmd: sha256sum
    sources_file: /etc/yum.repos.d/rocky.repo
    cloud_cfg: /etc/cloud/cloud.cfg
    sources_format: rpm
    family: rhel
    packages_file: config/packages-rpm.txt
    sysctl_file: config/sysctl-rhel.conf

  # CentOS 7 reached end of life on 2024-06-30. Its content is frozen on
  # vault.centos.org and no further security updates exist, so `frozen: true`
  # keeps it off the weekly schedule: a rebuild would reproduce the same image
  # under a new date tag and imply maintenance that is not happening. Build it
  # deliberately with a manual workflow_dispatch.
  - distro: centos
    codename: core
    major: "7"
    base_url: https://cloud.centos.org/centos/7/images
    image_name: CentOS-7-x86_64-GenericCloud-2211.qcow2
    sha_file: sha256sum.txt
    hash_cmd: sha256sum
    sources_file: /etc/yum.repos.d/CentOS-Base.repo
    cloud_cfg: /etc/cloud/cloud.cfg
    sources_format: rpm
    family: rhel
    packages_file: config/packages-rpm-centos7.txt
    sysctl_file: config/sysctl-rhel.conf
    frozen: true

